<!-- ==========================
MAIN CONTENT
========================== -->

<main class="content">

<div class="page-header">

<h1>

Department Management

</h1>

<p>

Create, Edit & Manage Departments

</p>

</div>

<!-- ==========================
ADD DEPARTMENT
========================== -->

<div class="card">

<h2>

<i class="fa-solid fa-plus-circle"></i>

Add New Department

</h2>

<div class="grid">

<div>

<label>

Department Name

</label>

<input
type="text"
id="departmentName"
placeholder="হিফজ বিভাগ">

</div>

<div>

<label>

Font Awesome Icon

</label>

<input
type="text"
id="departmentIcon"
placeholder="fa-solid fa-book-quran">

</div>

<div>

<label>

Display Order

</label>

<input
type="number"
id="departmentOrder"
placeholder="1">

</div>

<div>

<label>

Department Color

</label>

<input
type="color"
id="departmentColor"
value="#0d6efd">

</div>

<div class="full">

<label>

Description

</label>

<textarea
id="departmentDescription"
rows="5"></textarea>

</div>

<div>

<label>

Status

</label>

<select id="departmentStatus">

<option value="Active">Active</option>

<option value="Inactive">Inactive</option>

</select>

</div>

<div>

<label>

Publish Homepage

</label>

<input
type="checkbox"
id="departmentPublished"
checked>

</div>
<!-- ==========================
FORM ACTIONS
========================== -->

<div class="full actions">

<button
type="button"
id="saveDepartmentBtn"
class="btn btn-primary">

<i class="fa-solid fa-floppy-disk"></i>

Save Department

</button>

<button
type="reset"
class="btn btn-secondary">

<i class="fa-solid fa-rotate-left"></i>

Reset

</button>

</div>

</div>

</div>

<!-- ==========================
DEPARTMENT LIST
========================== -->

<div class="card">

<h2>

<i class="fa-solid fa-building-columns"></i>

All Departments

</h2>

<div class="table-box">

<table>

<thead>

<tr>

<th>#</th>

<th>Name</th>

<th>Icon</th>

<th>Order</th>

<th>Status</th>

<th>Publish</th>

<th>Action</th>

</tr>

</thead>

<tbody id="departmentTableBody">

<tr>

<td colspan="7">

Loading...

</td>

</tr>

</tbody>

</table>

</div>

</div>
<!-- ==========================
FIREBASE SDK
========================== -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="firebase-config.js"></script>

<script src="firebase.js"></script>

<!-- ==========================
DEPARTMENT JS
========================== -->

<script src="department-management.js?v=1"></script>

<!-- ==========================
PAGE LOADER
========================== -->

<div id="pageLoader" class="page-loader">

<div class="loader"></div>

</div>

<!-- ==========================
BACK TO TOP
========================== -->

<button id="backToTop" class="back-to-top">

<i class="fa-solid fa-arrow-up"></i>

</button>

<!-- ==========================
PAGE LOADER SCRIPT
========================== -->

<script>

window.addEventListener("load", function () {

    const loader = document.getElementById("pageLoader");

    if (loader) {

        setTimeout(function () {

            loader.style.opacity = "0";

            setTimeout(function () {

                loader.style.display = "none";

            }, 300);

        }, 500);

    }

});

</script>

<!-- ==========================
BACK TO TOP SCRIPT
========================== -->

<script>

const backToTop = document.getElementById("backToTop");

window.addEventListener("scroll", function () {

    if (window.scrollY > 300) {

        backToTop.classList.add("show");

    } else {

        backToTop.classList.remove("show");

    }

});

backToTop.addEventListener("click", function () {

    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

});

</script>

</main>

</div>
