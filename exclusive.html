<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exclusive - আল-হারামাইন মডেল মাদ্রাসা</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f8fafc; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .animate-pulse-slow { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl border border-orange-100 text-center">
        <div class="text-orange-500 text-6xl mb-6 animate-pulse-slow">
            <i class="fas fa-magic"></i>
        </div>

        <h1 class="text-3xl font-bold text-gray-800 mb-2">Exclusive</h1>
        <p class="text-gray-500 mb-8">আমাদের বিশেষ কার্যক্রমসমূহ এবং আপডেটগুলো পাওয়ার জন্য চোখ রাখুন।</p>
        
        <div class="bg-orange-50 p-4 rounded-lg border border-orange-200">
            <p class="text-orange-700 font-bold text-xl">শীঘ্রই প্রকাশিত করা হবে</p>
        </div>

        <a href="index.html" class="mt-8 inline-block bg-blue-900 text-white px-8 py-3 rounded-full font-semibold hover:bg-blue-800 transition">
            হোম পেজে ফিরে যান
        </a>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</body>
</html>
