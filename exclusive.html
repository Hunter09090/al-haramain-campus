<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exclusive - আল-হারামাইন মডেল মাদ্রাসা</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f8fafc; }
        
        /* খুশিতে লাফাচ্ছে বা উদযাপনের জন্য কাস্টম অ্যানিমেশন */
        @keyframes jump-joy {
            0%, 100% { transform: translateY(0) scale(1); }
            40% { transform: translateY(-15px) scale(1.05); }
            60% { transform: translateY(-5px) scale(0.98); }
        }
        .animate-joy {
            animation: jump-joy 1.5s ease-in-out infinite;
        }

        /* ট্রফির হালকা গ্লো বা পালস এফেক্ট */
        @keyframes pulse-slow {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.9; }
        }
        .animate-pulse-slow {
            animation: pulse-slow 2s ease-in-out infinite;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="max-w-xl w-full bg-white p-8 rounded-2xl shadow-xl border border-amber-100 text-center relative overflow-hidden">
        
        <!-- উদযাপনের ব্যাকগ্রাউন্ড টপ বার -->
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-amber-400 via-yellow-500 to-amber-600"></div>

        <!-- লোগো ও আইকন সেকশন: ট্রফি এবং খুশিতে লাফাচ্ছে এমন রিঅ্যাকশন -->
        <div class="flex flex-col items-center justify-center mb-6">
            <div class="relative inline-block">
                <!-- মূল ট্রফি আইকন -->
                <div class="text-amber-500 text-7xl animate-pulse-slow drop-shadow-md">
                    <i class="fas fa-trophy"></i>
                </div>
                <!-- খুশিতে লাফাচ্ছে এমন রিঅ্যাকশন স্টার ও টেক্সট -->
                <div class="absolute -top-3 -right-4 bg-yellow-400 text-white text-xs px-2 py-1 rounded-full font-bold shadow-md animate-joy">
                    <i class="fas fa-laugh-beam mr-1"></i> আলহামদুলিল্লাহ্!
                </div>
                <div class="absolute -bottom-2 -left-4 text-orange-500 text-xl animate-joy" style="animation-delay: 0.3s;">
                    <i class="fas fa-star"></i>
                </div>
                <div class="absolute -top-1 -left-5 text-yellow-500 text-lg animate-joy" style="animation-delay: 0.6s;">
                    <i class="fas fa-sparkles"></i>
                </div>
            </div>
        </div>

        <h1 class="text-3xl font-bold text-gray-800 mb-2">Exclusive Achievement</h1>
        <p class="text-gray-500 mb-6">আল-হারামাইন মডেল মাদ্রাসার গৌরবময় সাফল্য</p>
        
        <!-- আপনার কাঙ্ক্ষিত মূল অর্জনের লেখাটি (ঠিক মাঝখানে এবং সুন্দর ডিজাইনে) -->
        <div class="bg-gradient-to-br from-amber-50 to-orange-50 p-6 rounded-xl border border-amber-200 shadow-sm transition hover:shadow-md">
            <p class="text-gray-800 font-medium text-lg leading-relaxed text-center">
                🏆 ২০২৫ সালের সরকারি ভিত্তি পরীক্ষায় আল-হারামাইন মডেল মাদ্রাসার ৪ জন শিক্ষার্থী বৃত্তি অর্জন করেছে, যা উখিয়া উপজেলার মধ্যে একক প্রতিষ্ঠান হিসেবে সর্বোচ্চ বৃত্তিপ্রাপ্তির গৌরব অর্জন করেছে।
            </p>
        </div>

        <!-- হোম বাটনে ফিরে যাওয়ার লিঙ্ক -->
        <a href="index.html" class="mt-8 inline-block bg-blue-900 text-white px-8 py-3 rounded-full font-semibold hover:bg-blue-800 shadow-md hover:shadow-lg transition transform hover:-translate-y-0.5">
            <i class="fas fa-home mr-2"></i> হোম পেজে ফিরে যান
        </a>
    </div>

    <!-- Font Awesome Icons এর জন্য লিঙ্ক -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</body>
</html>
