        function searchStudent() {
            let roll = document.getElementById('rollInput').value.trim();
            const className = document.getElementById('classSelect').value;
            
            if(!roll) {
                alert("দয়া করে রোল নম্বর লিখুন।");
                return;
            }

            // একক ডিজিট রোল থাকলে (যেমন: ১ থেকে ৯) স্বয়ংক্রিয়ভাবে ০ যোগ করে ২ ডিজিট করার লজিক
            if(roll.length === 1) {
                roll = "0" + roll;
            }
            
            const student = allStudents.find(s => s.roll == roll && s.class === className);

            if (student) {
                document.getElementById('displayName').innerText = student.name;
                document.getElementById('displayClass').innerText = student.class;
                document.getElementById('displayRoll').innerText = student.roll;
                document.getElementById('profileCard').classList.remove('hidden');
                
                // প্রোফাইলカード দেখার পর স্মুথলি স্ক্রোল হয়ে কার্ডের কাছে চলে যাওয়ার জন্য
                document.getElementById('profileCard').scrollIntoView({ behavior: 'smooth' });
            } else {
                alert("শিক্ষার্থীর তথ্য পাওয়া যায়নি। অনুগ্রহ করে রোল ও শ্রেণী সঠিক আছে কিনা যাচাই করুন।");
                document.getElementById('profileCard').classList.add('hidden');
            }
        }

        // PDF ডাউনলোড করার ফাংশন
        function downloadPDF() {
            const studentName = document.getElementById('displayName').innerText;
            const originalTitle = document.title;
            
            // ফাইলের নাম শিক্ষার্থীর নামে সুন্দর দেখানোর জন্য সাময়িক টাইটেল পরিবর্তন
            document.title = "Profile_" + studentName;
            
            // ব্রাউজারের প্রিন্ট ডায়ালগ ওপেন করা (যেখান থেকে "Save as PDF" অপশন পাওয়া যাবে)
            window.print();
            
            // টাইটেল আগের অবস্থায় ফিরিয়ে নেওয়া
            document.title = originalTitle;
        }
    </script>
</body>
