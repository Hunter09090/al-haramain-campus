<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শিক্ষার্থী প্রোফাইল - আল-হারামাইন মডেল মাদ্রাসা</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f1f5f9; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-md mx-auto">
        <h1 class="text-2xl font-bold text-center text-blue-900 mb-6">শিক্ষার্থী প্রোফাইল অনুসন্ধান</h1>

        <div class="bg-white p-6 rounded-2xl shadow-lg mb-6">
            <div class="mb-4">
                <label class="block text-sm font-bold text-gray-700 mb-2">শ্রেণী নির্বাচন করুন:</label>
                <select id="classSelect" class="w-full p-3 border rounded-xl bg-gray-50">
                    <option value="দ্বিতীয়">দ্বিতীয়</option>
                    <option value="তৃতীয়">তৃতীয়</option>
                    <option value="চতুর্থ">চতুর্থ</option>
                    <option value="পঞ্চম">পঞ্চম</option>
                    <option value="ষষ্ঠ">ষষ্ঠ</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-bold text-gray-700 mb-2">রোল নম্বর লিখুন:</label>
                <input type="number" id="rollInput" placeholder="রোল নম্বর" class="w-full p-3 border rounded-xl bg-gray-50">
            </div>
            <button onclick="searchStudent()" class="w-full bg-blue-900 text-white py-3 rounded-xl font-bold hover:bg-blue-800 transition">প্রোফাইল দেখুন</button>
        </div>

        <div id="profileCard" class="hidden bg-white p-8 rounded-3xl shadow-2xl border-t-8 border-blue-900 text-center">
            <div class="mb-6">
                <div class="w-20 h-20 bg-blue-900 rounded-full mx-auto flex items-center justify-center text-white text-3xl font-bold">AH</div>
                <h2 class="text-xl font-bold text-blue-900 mt-2">আল-হারামাইন মডেল মাদ্রাসা</h2>
                <p class="text-sm text-gray-500">ডিজিটাল স্টুডেন্ট প্রোফাইল</p>
            </div>

            <div class="text-left space-y-3 mb-6 bg-gray-50 p-4 rounded-xl">
                <p><span class="font-bold">নাম:</span> <span id="displayName">---</span></p>
                <p><span class="font-bold">শ্রেণী:</span> <span id="displayClass">---</span></p>
                <p><span class="font-bold">রোল:</span> <span id="displayRoll">---</span></p>
            </div>

            <div class="flex justify-center mb-6">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://al-haramain-digital-campus.github.io/" alt="QR Code" class="w-32 h-32 border-4 border-gray-100">
            </div>

            <p class="text-sm text-green-700 font-semibold italic">"সাফল্য তোমার অপেক্ষায়!"</p>
        </div>
    </div>

    <script>
        // আপনার আগের ডাটাবেসটি এখানে ব্যবহার হবে
        const allStudents = [
            /* এখানে আপনার আগের শিক্ষার্থীদের ডাটাগুলো বসিয়ে নিন */
            { roll: "01", name: "সুমাইয়া মুস্তারীন মীরা", class: "দ্বিতীয়" },
            { roll: "01", name: "মো: শরীফ আল হোসাইন", class: "তৃতীয়" }
            // বাকি সব ডাটা এখানে হবে...
        ];

        function searchStudent() {
            const roll = document.getElementById('rollInput').value;
            const className = document.getElementById('classSelect').value;
            const student = allStudents.find(s => s.roll == roll && s.class === className);

            if (student) {
                document.getElementById('displayName').innerText = student.name;
                document.getElementById('displayClass').innerText = student.class;
                document.getElementById('displayRoll').innerText = student.roll;
                document.getElementById('profileCard').classList.remove('hidden');
            } else {
                alert("শিক্ষার্থীর তথ্য পাওয়া যায়নি। সঠিক রোল ও শ্রেণী যাচাই করুন।");
            }
        }
    </script>
</body>
</html>
