<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | আল-হারামাইন</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-10">
    <div class="max-w-2xl mx-auto bg-slate-800 p-8 rounded-2xl shadow-xl">
        <h1 class="text-3xl font-bold text-green-400">স্বাগতম, প্রিয় শিক্ষার্থী!</h1>
        <p class="mt-4 text-gray-300">আপনার রেজাল্ট এবং ক্লাসের নোটিশ এখানে দেখতে পাবেন।</p>
        
        <div class="mt-8 border-t border-slate-700 pt-6">
            <h2 class="text-xl font-bold">আপনার প্রোফাইল:</h2>
            <p id="userEmail" class="text-green-300"></p>
        </div>

        <button id="logoutBtn" class="mt-8 bg-red-600 px-6 py-2 rounded font-bold hover:bg-red-700">লগ আউট</button>
    </div>

    <script type="module">
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
        
        const auth = getAuth();
        
        // লগইন চেক করা
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('userEmail').innerText = "ইমেইল: " + user.email;
            } else {
                window.location.href = "login.html"; // লগইন না থাকলে লগইন পেজে পাঠাবে
            }
        });

        // লগ আউট ফাংশন
        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => { window.location.href = "login.html"; });
        });
    </script>
</body>
</html>
