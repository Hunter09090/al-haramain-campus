<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ড্যাশবোর্ড | আল-হারামাইন</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyDYKfabHaqiUrX7__NT-M1IwOREXlX9IBA",
            authDomain: "al-haramain-digital-campus.firebaseapp.com",
            projectId: "al-haramain-digital-campus",
            storageBucket: "al-haramain-digital-campus.firebasestorage.app",
            messagingSenderId: "306805947710",
            appId: "1:306805947710:web:d0ed996b453928767a406f"
        };
        initializeApp(firebaseConfig);
        const auth = getAuth();

        onAuthStateChanged(auth, (user) => {
            if (!user) { window.location.href = "login.html"; }
        });

        window.logout = () => {
            signOut(auth).then(() => { window.location.href = "login.html"; });
        };
    </script>
</head>
<body class="bg-slate-900 text-white min-h-screen">

    <header class="bg-slate-950 p-6 flex justify-between items-center shadow-lg sticky top-0 z-50">
        <h1 class="text-xl font-bold text-green-400">ড্যাশবোর্ড</h1>
        <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg text-sm transition">লগ আউট</button>
    </header>

    <div class="max-w-md mx-auto p-4 space-y-4">
        
        <div class="grid grid-cols-2 gap-4">
            <a href="students.html" class="bg-slate-800 p-6 rounded-2xl border border-slate-700 text-center hover:border-green-500 transition">
                <span class="block text-4xl mb-2">🎓</span>
                <span class="font-bold">শিক্ষার্থীগণ</span>
            </a>
            
            <a href="results.html" class="bg-slate-800 p-6 rounded-2xl border border-slate-700 text-center hover:border-green-500 transition">
                <span class="block text-4xl mb-2">📝</span>
                <span class="font-bold">ফলাফল</span>
            </a>
            
            <a href="routine.html" class="bg-slate-800 p-6 rounded-2xl border border-slate-700 text-center hover:border-green-500 transition">
                <span class="block text-4xl mb-2">📅</span>

            </a>

            <a href="notice.html" class="bg-slate-800 p-6 rounded-2xl border border-slate-700 text-center hover:border-green-500 transition">
                <span class="block text-4xl mb-2">📢</span>
                <span class="font-bold">নোটিশ</span>
            </a>
        </div>

        <a href="teachers.html" class="block w-full bg-slate-800 p-6 rounded-2xl border border-slate-700 text-center hover:border-green-500 transition">
            <span class="block text-4xl mb-2">👨‍🏫</span>
            <span class="font-bold text-lg">শিক্ষক মহোদয়গণ</span>

        <a href="contact.html" class="block w-full bg-slate-800 p-4 rounded-2xl border border-slate-700 text-center hover:border-green-500 transition">

</html>
