<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ফলাফল অনুসন্ধান | আল-হারামাইন</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyDYKfabHaqiUrX7__NT-M1IwOREXlX9IBA",
            authDomain: "al-haramain-digital-campus.firebaseapp.com",
            projectId: "al-haramain-digital-campus",
            storageBucket: "al-haramain-digital-campus.firebasestorage.app",
            messagingSenderId: "306805947710",
            appId: "1:306805947710:web:d0ed996b453928767a406f"
        };
        initializeApp(firebaseConfig);
        onAuthStateChanged(getAuth(), (user) => {
            if (!user) { window.location.href = "login.html"; }
        });
    </script>
    <style>
        select { color-scheme: dark; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 font-sans text-sm md:text-base">

    <div class="max-w-2xl mx-auto mb-6">
        <a href="dashboard.html" class="text-green-400 hover:text-green-300 font-bold flex items-center">
            <span class="mr-2">←</span> ড্যাশবোর্ড ফিরুন
        </a>
    </div>

    <div class="max-w-xl mx-auto bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 overflow-hidden">
        <div class="bg-slate-700/50 p-6 border-b border-slate-600 text-center">
            <h2 class="text-2xl font-bold text-green-400">পরীক্ষার ফলাফল অনুসন্ধান</h2>
            <p class="text-slate-400 text-xs mt-1">আল-হারামাইন ডিজিটাল ক্যাম্পাস</p>
        </div>

        <div class="p-8 space-y-5">
            <div>
                <label class="block text-slate-300 mb-2 font-medium">শ্রেণী নির্বাচন করুন</label>
                <select id="class" class="w-full bg-slate-900 border border-slate-600 p-3 rounded-xl focus:border-green-500 outline-none transition">
                    <option value="">শ্রেণী বেছে নিন</option>
                    <option value="1">প্রথম শ্রেণী</option>
                    <option value="2">দ্বিতীয় শ্রেণী</option>
                    <option value="3">তৃতীয় শ্রেণী</option>
                    <option value="4">চতুর্থ শ্রেণী</option>
                    <option value="5">পঞ্চম শ্রেণী</option>
                </select>
            </div>

            <div>
                <label class="block text-slate-300 mb-2 font-medium">পরীক্ষার বছর</label>
                <select id="year" class="w-full bg-slate-900 border border-slate-600 p-3 rounded-xl focus:border-green-500 outline-none transition">
                    <option value="2026">২০২৬</option>
                    <option value="2025">২০২৫</option>
                    <option value="2024">২০২৪</option>
                </select>
            </div>

            <div>
                <label class="block text-slate-300 mb-2 font-medium">রোল নম্বর</label>
                <input type="number" id="roll" placeholder="আপনার রোল লিখুন" class="w-full bg-slate-900 border border-slate-600 p-3 rounded-xl focus:border-green-500 outline-none transition">
            </div>

            <button onclick="searchResult()" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-4 rounded-xl shadow-lg transform active:scale-95 transition-all text-lg">
                ফলাফল দেখুন
            </button>
        </div>

        <div id="resultBox" class="hidden p-6 bg-slate-900 border-t border-slate-700 animate-pulse">
            <div id="resultContent" class="space-y-4">
                </div>
        </div>
    </div>

    <script>
        function searchResult() {
            const classVal = document.getElementById('class').value;
            const yearVal = document.getElementById('year').value;
            const rollVal = document.getElementById('roll').value;
            const resultBox = document.getElementById('resultBox');
            const resultContent = document.getElementById('resultContent');

            if (!classVal || !rollVal) {
                alert("দয়া করে শ্রেণী এবং রোল নম্বর সঠিকভাবে পূরণ করুন।");
                return;
            }

            // রেজাল্ট দেখানোর সময় এনিমেশন
            resultBox.classList.remove('hidden');
            resultContent.innerHTML = "<p class='text-center text-green-400'>অনুসন্ধান করা হচ্ছে...</p>";

            // ডেমো ডেটা (পরবর্তীতে গুগল শিট থেকে এখানে ডেটা আসবে)
            setTimeout(() => {
                if (rollVal === "101") {
                    resultContent.innerHTML = `
                        <div class="border border-green-500/30 rounded-xl overflow-hidden bg-slate-800">
                            <div class="bg-green-600/20 p-3 text-center border-b border-green-500/30">
                                <h3 class="font-bold text-green-400 text-lg">ফলাফল কার্ড</h3>
                            </div>
                            <div class="p-4 space-y-2">
                                <div class="flex justify-between border-b border-slate-700 pb-2">
                                    <span class="text-slate-400">শিক্ষার্থীর নাম:</span>
                                    <span class="font-bold text-white">মোঃ আব্দুর রহমান</span>
                                </div>
                                <div class="flex justify-between border-b border-slate-700 pb-2">
                                    <span class="text-slate-400">শ্রেণী:</span>
                                    <span class="font-bold text-white">${classVal}</span>
                                </div>
                                <div class="flex justify-between border-b border-slate-700 pb-2">
                                    <span class="text-slate-400">রোল:</span>
                                    <span class="font-bold text-white">${rollVal}</span>
                                </div>
                                <div class="flex justify-between pt-2">
                                    <span class="text-slate-400 font-bold">জিপিএ:</span>
                                    <span class="font-bold text-yellow-400 text-xl">৫.০০ (উত্তীর্ণ)</span>
                                </div>
                            </div>
                        </div>
                        <button onclick="window.print()" class="w-full bg-slate-700 p-2 rounded-lg text-xs hover:bg-slate-600 transition">প্রিন্ট করুন</button>
                    `;
                } else {
                    resultContent.innerHTML = "<p class='text-center text-red-400 p-4'>দুঃখিত! রোল নম্বরটি আমাদের ডাটাবেসে পাওয়া যায়নি।</p>";
                }
                resultBox.classList.remove('animate-pulse');
            }, 1000);
        }
    </script>
</body>
</html>
