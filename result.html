<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ফলাফল | আল-হারামাইন</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyDYKfabHaqiUrX7__NT-M1IwOREXlX9IBA",
            authDomain: "al-haramain-digital-campus.firebaseapp.com",
            projectId: "al-haramain-digital-campus",
            storageBucket: "al-haramain-digital-campus.firebasestorage.app",
            messagingSenderId: "306805947710",
            appId: "1:306805947710:web:d0ed996b453928767a406f"
        };
        initializeApp(firebaseConfig);
        onAuthStateChanged(getAuth(), (user) => {
            if (!user) { window.location.href = "login.html"; }
        });
    </script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4">

    <div class="max-w-xl mx-auto mb-6">
        <a href="index.html" class="text-green-400 font-bold hover:underline">← হোম পেজে ফিরুন</a>
    </div>

    <div class="max-w-xl mx-auto bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-xl">
        <h2 class="text-2xl font-bold text-green-400 mb-6 text-center">পরীক্ষার ফলাফল</h2>
        
        <div class="space-y-4">
            <div>
                <label class="block text-slate-400 mb-1">শ্রেণী নির্বাচন</label>
                <select id="class" class="w-full bg-slate-900 border border-slate-600 p-3 rounded-xl focus:border-green-500 outline-none">
                    <option value="">শ্রেণী বেছে নিন</option>
                    <option value="১ম শ্রেণী">১ম শ্রেণী</option>
                    <option value="২য় শ্রেণী">২য় শ্রেণী</option>
                    <option value="৩য় শ্রেণী">৩য় শ্রেণী</option>
                    <option value="৪র্থ শ্রেণী">৪র্থ শ্রেণী</option>
                    <option value="৫ম শ্রেণী">৫ম শ্রেণী</option>
                </select>
            </div>

            <div>
                <label class="block text-slate-400 mb-1">পরীক্ষার নাম</label>
                <select id="examName" class="w-full bg-slate-900 border border-slate-600 p-3 rounded-xl focus:border-green-500 outline-none">
                    <option value="">পরীক্ষা নির্বাচন করুন</option>
                    <option value="প্রথম সাময়িক পরীক্ষা">প্রথম সাময়িক পরীক্ষা</option>
                    <option value="দ্বিতীয় সাময়িক পরীক্ষা">দ্বিতীয় সাময়িক পরীক্ষা</option>
                     <option value="অর্ধ বার্ষিক পরীক্ষা">অর্ধ বার্ষিক পরীক্ষা</option>
                    <option value="বার্ষিক পরীক্ষা">বার্ষিক পরীক্ষা</option>
                </select>
            </div>

            <div>
                <label class="block text-slate-400 mb-1">রোল নম্বর</label>
                <input type="number" id="roll" placeholder="রোল নম্বর লিখুন" class="w-full bg-slate-900 border border-slate-600 p-3 rounded-xl focus:border-green-500 outline-none">
            </div>

            <button onclick="searchResult()" class="w-full bg-green-600 hover:bg-green-500 font-bold py-3 rounded-xl transition">ফলাফল দেখুন</button>
        </div>

        <div id="resultOutput" class="mt-6 p-4 bg-slate-900 rounded-xl border border-slate-700 hidden">
        </div>
    </div>

    <script>
        function searchResult() {
            const exam = document.getElementById('examName').value;
            const roll = document.getElementById('roll').value;
            const output = document.getElementById('resultOutput');
            
            if(!exam || !roll) {
                alert("দয়া করে পরীক্ষার নাম ও রোল নম্বর পূরণ করুন");
                return;
            }

            output.innerHTML = `<p class='text-green-400 font-bold'>${exam}</p>
                                <p>রোল নম্বর: ${roll}</p>
                                <p class='text-yellow-400 mt-2'>ফলাফল প্রক্রিয়াদিন...</p>`;
            output.classList.remove('hidden');
        }
    </script>
</body>
</html>
