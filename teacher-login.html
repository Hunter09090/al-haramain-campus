<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শিক্ষক লগইন | আল-হারামাইন মডেল মাদ্রাসা</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDYKfabHaqiUrX7__NT-M1IwOREXlX9IBA",
            authDomain: "al-haramain-digital-campus.firebaseapp.com",
            projectId: "al-haramain-digital-campus",
            storageBucket: "al-haramain-digital-campus.firebasestorage.app",
            messagingSenderId: "306805947710",
            appId: "1:306805947710:web:d0ed996b453928767a406f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // লগইন ফাংশন
        window.loginTeacher = function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('loginBtn');

            if (!email || !password) {
                errorMsg.innerText = "দয়া করে ইমেইল এবং পাসওয়ার্ড দিন।";
                errorMsg.classList.remove('hidden');
                return;
            }

            btn.innerText = "অপেক্ষা করুন...";
            btn.disabled = true;

            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    window.location.href = "dashboard.html"; 
                })
                .catch(() => {
                    errorMsg.innerText = "ভুল ইমেইল বা পাসওয়ার্ড! পুনরায় চেষ্টা করুন।";
                    errorMsg.classList.remove('hidden');
                    btn.innerText = "প্রবেশ করুন";
                    btn.disabled = false;
                });
        }

        // এন্টার কি প্রেস করলে লগইন হবে
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loginTeacher();
        });
    </script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-blue-900">শিক্ষক লগইন</h1>
            <p class="text-gray-500 text-sm">অনুমোদিত শিক্ষকবৃন্দ লগইন করুন</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-bold text-gray-700">ইমেইল (ID):</label>
                <input type="email" id="email" class="w-full p-3 border rounded-xl bg-gray-50 mt-1" placeholder="teacher@alharamain.edu">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700">পাসওয়ার্ড:</label>
                <input type="password" id="password" class="w-full p-3 border rounded-xl bg-gray-50 mt-1" placeholder="••••••••">
            </div>
            
            <p id="errorMsg" class="text-red-500 text-xs hidden text-center font-bold"></p>

            <button id="loginBtn" onclick="loginTeacher()" class="w-full bg-blue-900 text-white py-3 rounded-xl font-bold hover:bg-blue-800 transition">প্রবেশ করুন</button>
        </div>

        <div class="mt-6 text-center text-xs text-gray-400">
            <a href="index.html" class="hover:underline">হোম পেজে ফিরে যান</a>
        </div>
    </div>
</body>
</html>
