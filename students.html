<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শিক্ষার্থী তালিকা - আল-হারমাইন ডিজিটাল ক্যাম্পাস</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-5">

    <div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-lg">
        <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">শিক্ষার্থী তালিকা</h2>
        
        <div class="flex justify-center gap-2 mb-6" id="filter-buttons">
            <button onclick="renderTable('সব')" class="bg-blue-600 text-white px-4 py-2 rounded">সব শ্রেণী</button>
            <button onclick="renderTable('চতুর্থ')" class="bg-gray-500 text-white px-4 py-2 rounded">চতুর্থ</button>
            <button onclick="renderTable('পঞ্চম')" class="bg-gray-500 text-white px-4 py-2 rounded">পঞ্চম</button>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-blue-600 text-white">
                        <th class="p-4 border">ক্রমিক</th>
                        <th class="p-4 border">শিক্ষার্থীর নাম</th>
                        <th class="p-4 border">শ্রেণী</th>
                    </tr>
                </thead>
                <tbody id="student-table" class="text-gray-700">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // এখানে আপনার সব শিক্ষার্থীদের তথ্য যোগ করবেন
        const allStudents = [
            { name: "ফাতেমা ইসলাম", class: "চতুর্থ" },
            { name: "নুসরাত ইসলাম ফারিহা", class: "চতুর্থ" },
            { name: "নাজিফা", class: "চতুর্থ" },
            // আপনি এখানে নতুন ডাটা যোগ করতে পারবেন
            { name: "রহিম", class: "পঞ্চম" },
            { name: "করিম", class: "পঞ্চম" }
        ];

        function renderTable(filterClass) {
            const tableBody = document.getElementById('student-table');
            tableBody.innerHTML = "";

            const filteredStudents = (filterClass === 'সব') 
                ? allStudents 
                : allStudents.filter(s => s.class === filterClass);

            filteredStudents.forEach((student, index) => {
                tableBody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-4 border">${index + 1}</td>
                        <td class="p-4 border font-medium">${student.name}</td>
                        <td class="p-4 border">${student.class}</td>
                    </tr>
                `;
            });
        }

        // পেজ লোড হওয়ার সময় সব ডাটা দেখাবে
        renderTable('সব');
    </script>
</body>
</html>
