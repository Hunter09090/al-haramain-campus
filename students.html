<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শিক্ষার্থীদের তালিকা - আল-হারমাইন ডিজিটাল ক্যাম্পাস</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-5">

    <div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-lg">
        <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">শিক্ষার্থীদের তথ্য তালিকা</h2>
        
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-blue-600 text-white">
                        <th class="p-4 border">রোল</th>
                        <th class="p-4 border">নাম</th>
                        <th class="p-4 border">শ্রেণী</th>
                    </tr>
                </thead>
                <tbody id="student-table" class="text-gray-700">
                    </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // আপনার Firebase কনফিগ
        const firebaseConfig = {
            apiKey: "AIzaSyDYKfabHaqiUrX7__NT-M1IwOREXlX9IBA",
            authDomain: "al-haramain-digital-campus.firebaseapp.com",
            projectId: "al-haramain-digital-campus",
            storageBucket: "al-haramain-digital-campus.firebasestorage.app",
            messagingSenderId: "306805947710",
            appId: "1:306805947710:web:d0ed996b453928767a406f",
            measurementId: "G-LSMDHF5TDY"
        };

        // Firebase শুরু করা
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const studentTable = document.getElementById('student-table');
        
        async function fetchStudents() {
            try {
                const querySnapshot = await getDocs(collection(db, "students"));
                studentTable.innerHTML = ""; // লোডিং মেসেজ মুছে দেওয়া
                
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    studentTable.innerHTML += `
                        <tr class="border-b hover:bg-gray-50">
                            <td class="p-4 border">${data.roll || 'N/A'}</td>
                            <td class="p-4 border">${data.name || 'N/A'}</td>
                            <td class="p-4 border">${data.class || 'N/A'}</td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("ডাটা আনতে সমস্যা হচ্ছে: ", error);
                studentTable.innerHTML = "<tr><td colspan='3' class='p-4 text-center text-red-500'>ডাটা লোড করতে সমস্যা হয়েছে।</td></tr>";
            }
        }

        fetchStudents();
    </script>
</body>
</html>
