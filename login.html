<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Al Haramain</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen p-4">
    <div class="bg-slate-800 p-8 rounded-2xl w-full max-w-sm shadow-xl text-center text-white">
        <h2 class="text-2xl font-bold mb-6 text-green-400">Student Login</h2>
        
        <input type="email" id="email" placeholder="Email Address" class="w-full p-3 mb-4 rounded bg-slate-700 border border-slate-600 focus:border-green-500 outline-none">
        <input type="password" id="password" placeholder="Password" class="w-full p-3 mb-6 rounded bg-slate-700 border border-slate-600 focus:border-green-500 outline-none">
        
        <button id="emailLoginBtn" class="w-full bg-green-500 py-3 rounded font-bold hover:bg-green-600 transition mb-4">Login with Email</button>
        <button id="googleLoginBtn" class="w-full bg-white text-slate-900 py-3 rounded font-bold hover:bg-gray-200 transition">Login with Google</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

        // আপনার ফায়ারবেস কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyDYKfabHaqiUrX7__NT-M1IwOREXlX9IBA",
            authDomain: "al-haramain-digital-campus.firebaseapp.com",
            projectId: "al-haramain-digital-campus",
            storageBucket: "al-haramain-digital-campus.firebasestorage.app",
            messagingSenderId: "306805947710",
            appId: "1:306805947710:web:d0ed996b453928767a406f",
            measurementId: "G-LSMDHF5TDY"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Email Login Logic
        document.getElementById('emailLoginBtn').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    window.location.href = "dashboard.html"; // সফল হলে ড্যাশবোর্ডে পাঠাবে
                })
                .catch((err) => {
                    alert("লগইন ব্যর্থ: " + err.message);
                });
        });

        // Google Login Logic
        document.getElementById('googleLoginBtn').addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .then(() => {
                    window.location.href = "dashboard.html"; // সফল হলে ড্যাশবোর্ডে পাঠাবে
                })
                .catch((err) => {
                    alert("Google লগইন ব্যর্থ: " + err.message);
                });
        });
    </script>
</body>
</html>
