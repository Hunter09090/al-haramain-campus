<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন | আল-হারামাইন</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-emerald-900 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm p-8 rounded-3xl shadow-2xl">
        <h2 id="formTitle" class="text-2xl font-bold text-emerald-900 mb-6 text-center">অ্যাডমিন লগইন</h2>
        
        <!-- ইনপুট ফিল্ড সমূহ -->
        <input type="email" id="email" placeholder="আপনার ইমেইল" class="w-full p-3 mb-4 rounded-xl border border-gray-300 outline-none focus:ring-2 focus:ring-emerald-500">
        <input type="password" id="password" placeholder="পাসওয়ার্ড" class="w-full p-3 mb-6 rounded-xl border border-gray-300 outline-none focus:ring-2 focus:ring-emerald-500">
        
        <!-- শুধুমাত্র লগইন বাটন সচল রাখা হয়েছে -->
        <button id="mainBtn" class="w-full bg-emerald-800 text-white py-3 rounded-xl font-bold hover:bg-emerald-900 transition">লগইন করুন</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

        // আপনার ফায়ারবেস কনফিগারেশন (অপরিবর্তিত)
        const firebaseConfig = {
            apiKey: "AIzaSyDYKfabHaqiUrX7__NT-M1IwOREXlX9IBA",
            authDomain: "al-haramain-digital-campus.firebaseapp.com",
            projectId: "al-haramain-digital-campus",
            storageBucket: "al-haramain-digital-campus.firebasestorage.app",
            messagingSenderId: "306805947710",
            appId: "1:306805947710:web:d0ed996b453928767a406f",
            measurementId: "G-LSMDHF5TDY"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const mainBtn = document.getElementById('mainBtn');

        // শুধুমাত্র সাইন-ইন লজিক
        mainBtn.addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert("অনুগ্রহ করে ইমেইল এবং পাসওয়ার্ড দুটিই লিখুন!");
                return;
            }

            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    window.location.href = "dashboard.html";
                })
                .catch((error) => {
                    alert("ভুল ইমেইল বা পাসওয়ার্ড! অথবা আপনি এই সাইটের অনুমোদিত ইউজার নন।");
                });
        });
    </script>
</body>
</html>
