<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>লগইন | আল-হারামাইন</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-emerald-900 flex items-center justify-center h-screen">
    <div class="bg-white p-10 rounded-2xl shadow-2xl w-96">
        <h2 class="text-3xl font-bold text-center text-emerald-900 mb-8">শিক্ষার্থী লগইন</h2>
        <form>
            <input type="email" placeholder="আপনার ইমেইল" class="w-full p-4 mb-4 border border-gray-300 rounded-lg focus:outline-none focus:border-emerald-500">
            <input type="password" placeholder="পাসওয়ার্ড" class="w-full p-4 mb-6 border border-gray-300 rounded-lg focus:outline-none focus:border-emerald-500">
            <button class="w-full bg-emerald-800 text-white py-4 rounded-lg font-bold hover:bg-emerald-700">প্রবেশ করুন</button>
        </form>
        <p class="text-center text-gray-500 mt-4 text-sm">একাউন্ট নেই? <a href="#" class="text-emerald-600 font-bold">নিবন্ধন করুন</a></p>
    </div>
</body>
</html>
