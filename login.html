<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>লগইন | আল-হারামাইন</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md">
        <h2 class="text-3xl font-black text-center text-gray-900 mb-8">স্বাগতম ফিরে আসার জন্য</h2>
        <form class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-gray-600 mb-2">ইমেইল</label>
                <input type="email" class="w-full p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-600 mb-2">পাসওয়ার্ড</label>
                <input type="password" class="w-full p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <button class="w-full bg-emerald-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-emerald-700 transition">লগইন করুন</button>
        </form>
    </div>
</body>
</html>
