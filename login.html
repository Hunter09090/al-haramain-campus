<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Login | Al Haramain</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center h-screen p-4">
    <div class="bg-slate-800 p-8 rounded-2xl w-full max-w-sm shadow-xl text-center">
        <h2 class="text-2xl font-bold mb-6 text-green-400">Student Login</h2>
        
        <input type="text" id="userId" placeholder="User ID" class="w-full p-3 mb-4 rounded bg-slate-700 text-white border border-slate-600 focus:border-green-500 outline-none">
        <input type="password" id="password" placeholder="Password" class="w-full p-3 mb-6 rounded bg-slate-700 text-white border border-slate-600 focus:border-green-500 outline-none">
        
        <button onclick="checkLogin()" class="w-full bg-green-500 py-3 rounded font-bold hover:bg-green-600 transition">Login Now</button>
    </div>

    <script>
        function checkLogin() {
            let pass = document.getElementById('password').value;
            // এখানে পাসওয়ার্ড চেক করা হচ্ছে
            if(pass === "123") {
                alert("লগইন সফল!");
                window.location.href = "index.html";
            } else {
                alert("ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।");
            }
        }
    </script>
</body>
</html>
