<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>শিক্ষার্থী তথ্য খুঁজুন | আল-হারামাইন</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-6">
    <div class="max-w-2xl mx-auto">
        <div class="bg-white p-6 rounded-2xl shadow-lg mb-8 border-t-4 border-emerald-600">
            <h2 class="text-xl font-bold text-emerald-900 mb-4">শিক্ষার্থী তথ্য খুঁজুন</h2>
            <div class="flex flex-col md:flex-row gap-4">
                <input type="text" id="searchInput" placeholder="নাম বা রোল নম্বর লিখুন..." class="flex-1 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
                <button onclick="searchStudent()" class="bg-emerald-800 text-white px-8 py-3 rounded-xl font-bold hover:bg-emerald-900">খুঁজুন</button>
            </div>
        </div>

        <div id="resultCard" class="hidden bg-white p-8 rounded-2xl shadow-xl border-l-8 border-emerald-500">
            <h3 class="text-2xl font-bold text-emerald-900 mb-6">শিক্ষার্থী প্রোফাইল</h3>
            <div class="space-y-4">
                <p><strong>নাম:</strong> <span id="resName"></span></p>
                <p><strong>রোল:</strong> <span id="resRoll"></span></p>
                <p><strong>শ্রেণী:</strong> <span id="resClass"></span></p>
                <p><strong>অন্যান্য তথ্য:</strong> <span id="resInfo"></span></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDYKfabHaqiUrX7__NT-M1IwOREXlX9IBA",
            authDomain: "al-haramain-digital-campus.firebaseapp.com",
            projectId: "al-haramain-digital-campus",
            storageBucket: "al-haramain-digital-campus.firebasestorage.app",
            messagingSenderId: "306805947710",
            appId: "1:306805947710:web:d0ed996b453928767a406f",
            measurementId: "G-LSMDHF5TDY"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.searchStudent = async () => {
            const keyword = document.getElementById('searchInput').value;
            const studentsRef = collection(db, "students");
            const q = query(studentsRef, where("name", "==", keyword)); // এখানে রোল দিয়েও সার্চ করা যাবে
            
            const querySnapshot = await getDocs(q);
            const resultCard = document.getElementById('resultCard');

            if (!querySnapshot.empty) {
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    document.getElementById('resName').innerText = data.name;
                    document.getElementById('resRoll').innerText = data.roll;
                    document.getElementById('resClass').innerText = data.class;
                    document.getElementById('resInfo').innerText = data.info || "প্রযোজ্য নয়";
                    resultCard.classList.remove('hidden');
                });
            } else {
                alert("দুঃখিত! এই নামে কোনো শিক্ষার্থী পাওয়া যায়নি।");
                resultCard.classList.add('hidden');
            }
        };
    </script>
</body>
</html>
