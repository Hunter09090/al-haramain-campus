<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>শিক্ষার্থী প্রোফাইল | আল-হারামাইন</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-6">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-xl">
        <h2 class="text-2xl font-bold text-emerald-800 mb-6 border-b pb-4">আমার প্রোফাইল</h2>
        
        <div id="profileDetails" class="space-y-4">
            <p><strong>নাম:</strong> <span id="userName">লোড হচ্ছে...</span></p>
            <p><strong>রোল:</strong> <span id="userRoll">---</span></p>
            <p><strong>ক্লাস:</strong> <span id="userClass">---</span></p>
            <p><strong>ইমেইল:</strong> <span id="userEmail">---</span></p>
        </div>
        
        <button onclick="window.history.back()" class="mt-8 bg-emerald-600 text-white px-6 py-2 rounded-lg">ফিরে যান</button>
    </div>
</body>
</html>
