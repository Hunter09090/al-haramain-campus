<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শিক্ষার্থী তালিকা | আল-হারামাইন</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <h2 class="text-3xl font-bold text-emerald-900 mb-6 text-center">শিক্ষার্থী তালিকা</h2>

        <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="নাম বা রোল দিয়ে খুঁজুন..." 
            class="w-full p-4 mb-6 rounded-xl border border-gray-300 shadow-sm outline-none focus:ring-2 focus:ring-emerald-500">

        <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
            <table class="w-full text-left" id="studentTable">
                <thead class="bg-emerald-800 text-white">
                    <tr>
                        <th class="p-4">রোল</th>
                        <th class="p-4">নাম</th>
                        <th class="p-4">শ্রেণী</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-gray-200">
                    </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDYKfabHaqiUrX7__NT-M1IwOREXlX9IBA",
            authDomain: "al-haramain-digital-campus.firebaseapp.com",
            projectId: "al-haramain-digital-campus",
            storageBucket: "al-haramain-digital-campus.firebasestorage.app",
            messagingSenderId: "306805947710",
            appId: "1:306805947710:web:d0ed996b453928767a406f",
            measurementId: "G-LSMDHF5TDY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ডাটাবেস থেকে ডাটা আনা
        async function loadData() {
            const querySnapshot = await getDocs(collection(db, "students"));
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = ""; 
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                tbody.innerHTML += `
                    <tr>
                        <td class="p-4">${data.roll}</td>
                        <td class="p-4">${data.name}</td>
                        <td class="p-4">${data.class}</td>
                    </tr>
                `;
            });
        }

        loadData();

        // সার্চ ফিল্টার লজিক
        window.filterTable = function() {
            let input = document.getElementById("searchInput").value.toLowerCase();
            let rows = document.getElementById("tableBody").getElementsByTagName("tr");
            for (let i = 0; i < rows.length; i++) {
                let text = rows[i].textContent.toLowerCase();
                rows[i].style.display = text.includes(input) ? "" : "none";
            }
        }
    </script>
</body>
</html>
