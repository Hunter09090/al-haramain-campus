<!-- ==========================================================
MAIN
========================================================== -->

<div class="admin-main">

<header class="admin-header">

<div>

<h1>

Notice Management

</h1>

<p>

সকল নোটিশ এখান থেকে নিয়ন্ত্রণ করুন

</p>

</div>

</header>

<!-- ==========================================================
NOTICE FORM
========================================================== -->

<section class="dashboard-section">

<div class="dashboard-box">

<h2>

<i class="fa-solid fa-circle-plus"></i>

নতুন Notice যোগ করুন

</h2>

<form id="noticeForm">

<div class="input-group">

<label>

Notice Title

</label>

<input
type="text"
id="noticeTitle"
required>

</div>

<div class="input-group">

<label>

Category

</label>

<select id="noticeCategory">

<option>ভর্তি</option>

<option>পরীক্ষা</option>

<option>ছুটি</option>

<option>সাধারণ</option>

<option>জরুরি</option>

</select>

</div>
<div class="input-group">

<label>

Notice Description

</label>

<textarea
id="noticeDescription"
rows="6"
placeholder="নোটিশের বিস্তারিত লিখুন..."
required></textarea>

</div>

<div class="input-group">

<label>

প্রকাশের তারিখ

</label>

<input
type="date"
id="noticeDate"
required>

</div>

<div class="input-group">

<label>

PDF File (ঐচ্ছিক)

</label>


</div>

<div class="input-group">

<label>

Notice Image (ঐচ্ছিক)

</label>



</div>

<div class="admin-checkbox-group">

<label>

<input
type="checkbox"
id="noticeImportant">

গুরুত্বপূর্ণ Notice

</label>

</div>

<div class="admin-checkbox-group">

<label>

<input
type="checkbox"
id="noticeNew">

NEW Badge দেখাবে

</label>

</div>

<div class="admin-checkbox-group">

<label>

<input
type="checkbox"
id="noticePublished"
checked>

সাথে সাথে Publish হবে

</label>

</div>

<button
type="submit"
class="btn btn-primary admin-submit-btn">

<i class="fa-solid fa-paper-plane"></i>

Notice Publish

</button>

</form>

</div>

</section>

<!-- ==========================================================
NOTICE LIST
========================================================== -->

<section class="dashboard-section">

<div class="dashboard-box">

<div class="box-header">

<h2>

<i class="fa-solid fa-list"></i>

সকল Notice

</h2>

<input
type="search"
id="searchNotice"
placeholder="নোটিশ খুঁজুন...">

</div>

<div id="noticeList">

<!-- Firebase থেকে Notice এখানে আসবে -->

</div>
<!-- ==========================================================
NOTICE TEMPLATE
========================================================== -->


    <div class="notice-item-actions">

        <button class="btn btn-primary editNotice">

            <i class="fa-solid fa-pen"></i>

            Edit

        </button>

        <button class="btn btn-outline deleteNotice">

            <i class="fa-solid fa-trash"></i>

            Delete

        </button>

        <button class="btn btn-primary previewNotice">

            <i class="fa-solid fa-eye"></i>

            Preview

        </button>

    </div>

</div>

</div>

</section>
