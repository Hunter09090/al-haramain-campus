<!-- মডাল উইন্ডো (HTML স্ট্রাকচার) -->
<div id="infoModal" class="hidden fixed inset-0 bg-black/60 z-[9999] flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl animate-item">
        <div class="p-4 flex items-center justify-between border-b">
            <div class="flex items-center gap-3">
                <div id="modalIcon"></div>
                <h3 id="modalTitle" class="font-bold text-gray-800"></h3>
            </div>
            <button onclick="closeInfoModal()" class="text-gray-500 hover:text-red-500 text-xl"><i class="fas fa-times"></i></button>
        </div>
        <div id="modalBody" class="p-4 text-sm text-gray-700 max-h-[60vh] overflow-y-auto"></div>
    </div>
</div>

<!-- আপনার মূল জাভাস্ক্রিপ্ট লজিক -->
<script>
    // মডাল কন্ট্রোল ফাংশন
    function showModal(title, iconHtml, bgClass, bodyContent) {
        document.getElementById('modalTitle').innerText = title;
        const mIcon = document.getElementById('modalIcon');
        mIcon.innerHTML = iconHtml;
        mIcon.className = `w-10 h-10 rounded-full flex items-center justify-center text-xl shadow-inner ${bgClass}`;
        document.getElementById('modalBody').innerHTML = bodyContent;
        document.getElementById('infoModal').classList.remove('hidden');
        document.body.style.overflow = 'hidden';
    }

    function closeInfoModal() {
        document.getElementById('infoModal').classList.add('hidden');
        document.body.style.overflow = 'auto';
    }

    // আপনার আগে থেকে থাকা ডাটা অবজেক্টগুলো এখানে যোগ করে দিন (achieveData, deptData)
    // এবং মডাল ওপেন করার ফাংশনগুলো (openWelcomeModal, openDeptModal ইত্যাদি) এখানে রাখুন।
</script>
