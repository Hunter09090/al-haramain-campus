<section class="department-details">

    <div class="container">

        <!-- Banner -->

        <div class="department-banner">

            <img id="departmentImage"

                 src="https://placehold.co/1200x650?text=Department"

                 alt="Department">

        </div>

        <!-- Name & Description -->

        <div class="department-info-box">

            <span class="department-badge">

                বিভাগ

            </span>

            <h2 id="departmentName">

                বিভাগের নাম

            </h2>

            <p id="departmentDescription">

                এখানে বিভাগের সম্পূর্ণ পরিচিতি দেখানো হবে।
                পরবর্তীতে এই তথ্য Firebase Database থেকে
                স্বয়ংক্রিয়ভাবে লোড হবে।

            </p>

        </div>

        <!-- Statistics -->

        <div class="department-stats">

            <div class="stat-box">

                <i class="fa-solid fa-users"></i>

                <h3 id="teacherCount">

                    ০

                </h3>

                <p>

                    শিক্ষক

                </p>

            </div>

            <div class="stat-box">

                <i class="fa-solid fa-user-graduate"></i>

                <h3 id="studentCount">

                    ০

                </h3>

                <p>

                    শিক্ষার্থী

                </p>

            </div>

            <div class="stat-box">

                <i class="fa-solid fa-calendar-days"></i>

                <h3 id="departmentYear">

                    ২০১৩

                </h3>

                <p>

                    প্রতিষ্ঠা সাল

                </p>

            </div>

            <div class="stat-box">

                <i class="fa-solid fa-book-open"></i>

                <h3 id="departmentType">

                    পূর্ণকালীন

                </h3>

                <p>

                    শিক্ষা কার্যক্রম

                </p>

            </div>

        </div>
