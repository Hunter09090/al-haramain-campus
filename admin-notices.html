<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Notice Management | Al-Haramain
  </title>

  <link
    rel="stylesheet"
    href="admin-notices.css"
  >

</head>


<body>


<!-- =========================================
     HEADER
========================================== -->

<header class="topbar">

  <a
    href="admin.html"
    class="back-btn"
  >
    ← Dashboard
  </a>


  <div>

    <strong>
      📢 Notice Management
    </strong>

    <small>
      Al-Haramain Digital
    </small>

  </div>


  <button
    id="logoutBtn"
    class="logout-btn"
  >
    Logout
  </button>

</header>



<!-- =========================================
     MAIN
========================================== -->

<main class="container">


  <!-- PAGE TITLE -->

  <section class="page-title">

    <h1>
      নোটিশ পরিচালনা
    </h1>

    <p>
      নতুন নোটিশ যোগ করুন এবং পুরোনো নোটিশ
      পরিবর্তন বা মুছে ফেলুন।
    </p>

  </section>



  <!-- =======================================
       NOTICE FORM
  ======================================== -->

  <section class="form-card">

    <h2 id="formTitle">
      ➕ নতুন নোটিশ
    </h2>


    <form id="noticeForm">


      <!-- TITLE -->

      <label>
        নোটিশের শিরোনাম
      </label>

      <input
        type="text"
        id="noticeTitle"
        placeholder="যেমন: বার্ষিক পরীক্ষার নোটিশ"
        required
      >



      <!-- DATE -->

      <label>
        নোটিশের তারিখ
      </label>

      <input
        type="date"
        id="noticeDate"
        required
      >



      <!-- DESCRIPTION -->

      <label>
        নোটিশের বিস্তারিত
      </label>

      <textarea
        id="noticeDescription"
        rows="7"
        placeholder="নোটিশের বিস্তারিত এখানে লিখুন..."
        required
      ></textarea>



      <!-- IMPORTANT -->

      <label class="check-row">

        <input
          type="checkbox"
          id="noticeImportant"
        >

        <span>
          এটি গুরুত্বপূর্ণ নোটিশ
        </span>

      </label>



      <!-- BUTTONS -->

      <div class="form-buttons">

        <button
          type="submit"
          class="save-btn"
          id="saveBtn"
        >
          💾 নোটিশ সংরক্ষণ
        </button>


        <button
          type="button"
          id="cancelBtn"
          class="cancel-btn hidden"
        >
          বাতিল
        </button>

      </div>


      <p
        id="formMessage"
        class="message"
      ></p>

    </form>

  </section>



  <!-- =======================================
       NOTICE LIST
  ======================================== -->

  <section class="list-section">

    <div class="list-heading">

      <div>

        <h2>
          📋 প্রকাশিত নোটিশ
        </h2>

        <p>
          মোট:
          <strong id="noticeTotal">
            0
          </strong>
        </p>

      </div>

    </div>


    <div id="noticeList">

      <div class="loading">
        নোটিশ লোড হচ্ছে...
      </div>

    </div>

  </section>


</main>



<!-- =========================================
     JAVASCRIPT
========================================== -->

<script type="module" src="admin-notices.js"></script>


</body>

</html>
