<!-- =================================================
     MOBILE MENU SCRIPT
================================================= -->

<script>

  (() => {

    const menuBtn =
      document.querySelector(".menu-btn");

    const navLinks =
      document.querySelector(".nav-links");


    if (!menuBtn || !navLinks) return;


    menuBtn.addEventListener("click", () => {

      const isOpen =
        navLinks.classList.toggle("open");


      menuBtn.setAttribute(
        "aria-expanded",
        isOpen
      );


      menuBtn.textContent =
        isOpen ? "✕" : "☰";

    });


    /*
      Mobile menu থেকে কোনো link চাপলে
      menu automatically বন্ধ হবে।
    */

    navLinks
      .querySelectorAll("a")
      .forEach(link => {

        link.addEventListener("click", () => {

          navLinks.classList.remove("open");

          menuBtn.setAttribute(
            "aria-expanded",
            "false"
          );

          menuBtn.textContent = "☰";

        });

      });


  })();

</script>
